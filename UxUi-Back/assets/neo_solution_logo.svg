<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="100%" height="100%">
  <defs>
    <!-- Deep Blue 3D Sphere Radial Gradient -->
    <radialGradient id="neoBlueSphere" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#7399f7"/>
      <stop offset="25%" stop-color="#2b4db3"/>
      <stop offset="60%" stop-color="#142668"/>
      <stop offset="90%" stop-color="#091338"/>
      <stop offset="100%" stop-color="#04091c"/>
    </radialGradient>
    
    <!-- Forest Green 3D Sphere Radial Gradient -->
    <radialGradient id="neoGreenSphere" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#5ec95e"/>
      <stop offset="25%" stop-color="#238029"/>
      <stop offset="60%" stop-color="#125219"/>
      <stop offset="90%" stop-color="#0a3310"/>
      <stop offset="100%" stop-color="#041a08"/>
    </radialGradient>

    <!-- NEO 3D Blue Gradient with Metallic Sheen -->
    <linearGradient id="neoTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b62c4"/>
      <stop offset="18%" stop-color="#24459c"/>
      <stop offset="50%" stop-color="#142b6e"/>
      <stop offset="80%" stop-color="#0a1945"/>
      <stop offset="100%" stop-color="#050e29"/>
    </linearGradient>

    <!-- Specular Highlight Overlay Gradient -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="neoLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#0a1535" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 4 Spheres Emblem (Left) -->
  <g transform="translate(6, 4)" filter="url(#neoLogoShadow)">
    <!-- Top-Left Sphere (Blue) -->
    <circle cx="28" cy="28" r="17" fill="url(#neoBlueSphere)"/>
    <ellipse cx="23" cy="23" rx="7" ry="4" fill="url(#specularGlow)" transform="rotate(-30 23 23)"/>

    <!-- Top-Right Sphere (Green) -->
    <circle cx="62" cy="38" r="16" fill="url(#neoGreenSphere)"/>
    <ellipse cx="57" cy="33" rx="6" ry="3.5" fill="url(#specularGlow)" transform="rotate(-30 57 33)"/>

    <!-- Bottom-Left Sphere (Green) -->
    <circle cx="30" cy="62" r="16" fill="url(#neoGreenSphere)"/>
    <ellipse cx="25" cy="57" rx="6" ry="3.5" fill="url(#specularGlow)" transform="rotate(-30 25 57)"/>

    <!-- Bottom-Right Sphere (Blue) -->
    <circle cx="62" cy="72" r="17" fill="url(#neoBlueSphere)"/>
    <ellipse cx="57" cy="67" rx="7" ry="4" fill="url(#specularGlow)" transform="rotate(-30 57 67)"/>
  </g>

  <!-- Brand Typography (Right) -->
  <g filter="url(#neoLogoShadow)">
    <!-- "NEO" in Bold 3D Letters -->
    <text x="96" y="58" 
          font-family="'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="58" 
          font-weight="900" 
          letter-spacing="2.5"
          fill="url(#neoTextGrad)">NEO</text>
  </g>

  <!-- "Solution" in Italic Serif Typeface -->
  <text x="130" y="84" 
        font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
        font-size="28" 
        font-style="italic" 
        font-weight="600"
        letter-spacing="0.5" 
        fill="#0f2252">Solution</text>
</svg>
