<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 94" width="100%" height="100%">
  <defs>
    <!-- Deep Blue 3D Sphere Radial Gradient -->
    <radialGradient id="iconBlueSphere" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#7399f7"/>
      <stop offset="25%" stop-color="#2b4db3"/>
      <stop offset="60%" stop-color="#142668"/>
      <stop offset="90%" stop-color="#091338"/>
      <stop offset="100%" stop-color="#04091c"/>
    </radialGradient>
    
    <!-- Forest Green 3D Sphere Radial Gradient -->
    <radialGradient id="iconGreenSphere" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#5ec95e"/>
      <stop offset="25%" stop-color="#238029"/>
      <stop offset="60%" stop-color="#125219"/>
      <stop offset="90%" stop-color="#0a3310"/>
      <stop offset="100%" stop-color="#041a08"/>
    </radialGradient>

    <!-- Specular Highlight Overlay Gradient -->
    <linearGradient id="iconSpecularGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#0a1535" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(3, 3)" filter="url(#iconShadow)">
    <!-- Top-Left Sphere (Blue) -->
    <circle cx="28" cy="28" r="17" fill="url(#iconBlueSphere)"/>
    <ellipse cx="23" cy="23" rx="7" ry="4" fill="url(#iconSpecularGlow)" transform="rotate(-30 23 23)"/>

    <!-- Top-Right Sphere (Green) -->
    <circle cx="62" cy="38" r="16" fill="url(#iconGreenSphere)"/>
    <ellipse cx="57" cy="33" rx="6" ry="3.5" fill="url(#iconSpecularGlow)" transform="rotate(-30 57 33)"/>

    <!-- Bottom-Left Sphere (Green) -->
    <circle cx="30" cy="62" r="16" fill="url(#iconGreenSphere)"/>
    <ellipse cx="25" cy="57" rx="6" ry="3.5" fill="url(#iconSpecularGlow)" transform="rotate(-30 25 57)"/>

    <!-- Bottom-Right Sphere (Blue) -->
    <circle cx="62" cy="72" r="17" fill="url(#iconBlueSphere)"/>
    <ellipse cx="57" cy="67" rx="7" ry="4" fill="url(#iconSpecularGlow)" transform="rotate(-30 57 67)"/>
  </g>
</svg>
